name: Full Browser Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-matrix:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: chromium-mobile
            browser: chromium
          - project: webkit-mobile
            browser: webkit

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          {
            echo "### Full browser gate identity"
            echo "- Candidate SHA: \`${{ github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Project: \`${{ matrix.project }}\`"
            echo "- Engine: \`${{ matrix.browser }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} only
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.project }}
        run: npx playwright test --config=playwright.e2e.config.js --project=${{ matrix.project }}

      - name: Print failure context to the job log
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          for f in test-results/**/error-context.md; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-${{ matrix.project }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

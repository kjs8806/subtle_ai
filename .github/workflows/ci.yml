name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subtle_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d subtle_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify PR merge candidate identity
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The checked-out commit must be exactly the candidate GitHub
          # Actions says it built, and the merge candidate's second parent
          # must be exactly the PR's head commit - these are the two
          # guarantees that actually matter (CI ran the real candidate, and
          # that candidate really contains the exact PR head).
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          # GitHub's refs/pull/<n>/merge is a synthetic merge of the PR head
          # onto the CURRENT tip of the base branch, and is regenerated every
          # time the base branch moves. github.event.pull_request.base.sha is
          # only a snapshot captured when this specific event fired, and goes
          # stale the moment another PR merges into the base branch before
          # (or while) this job runs - asserting HEAD^1 equals that snapshot
          # exactly is therefore a race, not a real integrity check: it can
          # fail on a candidate that is perfectly legitimate, just built
          # against a newer base than the payload knew about. The property
          # that actually matters - "the base side of this merge is a real
          # point in the base branch's own history, not a fabricated or
          # unrelated commit" - is what we verify instead, against a freshly
          # fetched base ref so it can't itself go stale mid-job.
          git fetch --no-tags origin "$PR_BASE_REF"
          git merge-base --is-ancestor HEAD^1 FETCH_HEAD
          {
            echo "### CI identity"
            echo "- PR head (verified as merge candidate's 2nd parent): \`$PR_HEAD_SHA\`"
            echo "- PR base ref: \`$PR_BASE_REF\`"
            echo "- PR base SHA at event time: \`$PR_BASE_SHA\`"
            echo "- Merge candidate's actual base parent: \`$(git rev-parse HEAD^1)\`"
            echo "- Candidate merge: \`$CANDIDATE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subtle_ai_test
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subtle_ai_test
      - name: Run application-runtime PostgreSQL persistence tests
        run: npm run test:runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subtle_ai_test
      - name: Run browser smoke suite
        run: npm run test:smoke
      - name: Build application
        run: npm run build
      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR merge candidate identity
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          {
            echo "### CI identity"
            echo "- PR head: \`$PR_HEAD_SHA\`"
            echo "- PR base: \`$PR_BASE_SHA\`"
            echo "- Candidate merge: \`$CANDIDATE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi

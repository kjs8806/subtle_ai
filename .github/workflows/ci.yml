name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Fast PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: subtle_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d subtle_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify PR merge candidate identity
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          git fetch --no-tags origin "$PR_BASE_REF"
          git merge-base --is-ancestor HEAD^1 FETCH_HEAD
          {
            echo "### CI identity"
            echo "- PR head (verified as merge candidate's 2nd parent): \`$PR_HEAD_SHA\`"
            echo "- PR base ref: \`$PR_BASE_REF\`"
            echo "- PR base SHA at event time: \`$PR_BASE_SHA\`"
            echo "- Merge candidate's actual base parent: \`$(git rev-parse HEAD^1)\`"
            echo "- Candidate merge: \`$CANDIDATE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record main candidate identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          {
            echo "### CI identity"
            echo "- Main SHA: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium only
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subtle_ai_test

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subtle_ai_test

      - name: Run application-runtime PostgreSQL persistence tests
        run: npm run test:runtime
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/subtle_ai_test

      - name: Build application
        run: npm run build

      - name: Run critical Chromium smoke suite
        run: npm run test:smoke

      - name: Print smoke failure context to the job log
        if: failure()
        shell: bash
        run: |
          shopt -s globstar nullglob
          for f in test-results/**/error-context.md; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload smoke-test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-smoke-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
